<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Database Management Platform</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Database Management Platform</a>
    {{if .Principal.Username}}
    <form method="post" action="/logout" class="logout-form">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button type="submit">Keluar</button>
    </form>
    {{end}}
  </header>
  <main class="container">
    {{if .Flash}}
      {{$kind := .FlashKind}}
      {{if not $kind}}{{$kind = "info"}}{{end}}
      <div class="flash-message {{if eq $kind "success"}}flash-success{{else if eq $kind "error"}}flash-error{{else}}flash-info{{end}}" role="{{if eq $kind "error"}}alert{{else}}status{{end}}">{{.Flash}}</div>
    {{end}}
    {{template "content" .}}
  </main>
</body>
</html>
