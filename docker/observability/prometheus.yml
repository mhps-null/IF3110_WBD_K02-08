# Prometheus scrape configuration for API server, Async Worker, and OTel Collector.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "dbplatform-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080", "host.docker.internal:8081"]

  - job_name: "dbplatform-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
